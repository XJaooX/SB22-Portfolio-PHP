name: Portfolio SB22 Quality Checks
on:
  push:
    branches:
      - stage/portfolio-ux-mobile-20261015
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PHP and JavaScript smoke tests
        run: bash scripts/qa.sh
